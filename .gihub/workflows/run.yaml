      - name: Train model
        run: |
          python -m pip install -r requirements.txt
          python train_model.py

      - name: Upload confusion matrix and feature importance plots
        id: plots
        uses: actions/upload-artifact@v7
        with:
          name: iris-model-plots
          path: |
            ConfusionMatrix.png
            FeatureImportance.png
          if-no-files-found: error

      - name: Post model scores and plot link
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLOTS_URL: ${{ steps.plots.outputs.artifact-url }}
        run: |
          {
            echo '## Random Forest and Logistic Regression scores'
            echo
            echo '```text'
            cat scores.txt
            echo '```'
            echo
            echo "[Download the confusion matrix and feature importance plots]($PLOTS_URL)"
          } > report.md

          cml comment create --target=commit --publish=false report.md
